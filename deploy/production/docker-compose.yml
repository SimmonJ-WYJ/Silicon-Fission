# 硅基裂变 · 生产部署(new-api + Postgres + Redis + Caddy 自动 HTTPS)
#
# 面向正式对用户上线:Postgres 抗并发、Caddy 自动签发 Let's Encrypt 证书。
# new-api 不对外暴露端口,只由 Caddy 反向代理,统一走 HTTPS。
#
# 前置:①域名已解析到本机公网 IP(A 记录);②已放行 80/443 端口。
# 启动:cp .env.example .env && 编辑 .env && docker compose up -d

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: sf-new-api
    restart: always
    expose:
      - "3000" # 仅容器内网可见,由 caddy 代理
    environment:
      SQL_DSN: "postgresql://${PG_USER:?}:${PG_PASSWORD:?}@postgres:5432/${PG_DB:?}"
      REDIS_CONN_STRING: "redis://default:${REDIS_PASSWORD:?}@redis:6379"
      TZ: Asia/Shanghai
      NODE_NAME: sf-prod
      ERROR_LOG_ENABLED: "true"
      SESSION_SECRET: "${SESSION_SECRET:?}"
      SESSION_COOKIE_SECURE: "true" # 处于 HTTPS 之后
      SESSION_COOKIE_TRUSTED_URL: "https://${DOMAIN}" # 安全 Cookie 要求声明可信域名
      # 境外模型出海代理(可选):若本机 IP 无法直连 api.openai.com,填代理地址。
      # 更推荐在后台给单个境外渠道配代理,粒度更细。
      # HTTPS_PROXY: "http://your-egress-proxy:port"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: sf-postgres
    restart: always
    environment:
      POSTGRES_USER: "${PG_USER:?}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?}"
      POSTGRES_DB: "${PG_DB:?}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: sf-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2
    container_name: sf-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - new-api

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
