<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siliconfission - 统一的大模型接入平台</title>
  <link rel="icon" type="image/svg+xml" href="/brand/siliconfission.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1060FF;
      --primary-hover: #0050E6;
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --bg: #f8f9fa;
      --border: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      background: white;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      padding: 0 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo img {
      width: 28px;
      height: 28px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-primary);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .icon-btn:hover {
      color: var(--primary);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    /* Hero */
    .hero {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }

    .hero h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 40px;
    }

    .hero-subtitle .underline {
      text-decoration: underline;
      color: var(--text-primary);
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Footer */
    footer {
      padding: 32px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      background: white;
    }

    /* Language specific content */
    [lang="en"] .zh-only,
    [lang="zh-CN"] .en-only {
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 42px;
      }

      .hero-subtitle {
        font-size: 16px;
      }

      .nav-links {
        display: none;
      }

      .header-left {
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-left">
        <a href="/" class="logo">
          <img src="/brand/siliconfission.svg" alt="Siliconfission">
          <span>Siliconfission</span>
        </a>
        <nav class="nav-links">
          <a href="/" class="zh-only">主页</a>
          <a href="/" class="en-only">Home</a>
          <a href="/console" class="zh-only">控制台</a>
          <a href="/console" class="en-only">Console</a>
          <a href="/console/model" class="zh-only">模型广场</a>
          <a href="/console/model" class="en-only">Models</a>
          <a href="/console/leaderboard" class="zh-only">排行榜</a>
          <a href="/console/leaderboard" class="en-only">Leaderboard</a>
        </nav>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleLanguage()" title="Language">
          <span>🌐</span>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Theme">
          <span class="theme-icon">☀️</span>
        </button>
        <a href="/console/register" class="user-avatar" title="Sign up">S</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="zh-only">统一的大模型接入平台</h1>
      <h1 class="en-only">The Unified Interface For LLMs</h1>

      <p class="hero-subtitle zh-only">
        更优<span class="underline">价格</span>，更高<span class="underline">可用性</span>，无需订阅。
      </p>
      <p class="hero-subtitle en-only">
        Better <span class="underline">prices</span>, better <span class="underline">uptime</span>, no subscriptions.
      </p>

      <div class="hero-actions">
        <a href="/console/register" class="btn btn-primary zh-only">
          创建 API Key
        </a>
        <a href="/console/register" class="btn btn-primary en-only">
          Get API Key
        </a>

        <a href="/console/model" class="btn btn-secondary zh-only">
          浏览模型 →
        </a>
        <a href="/console/model" class="btn btn-secondary en-only">
          Explore Models →
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Siliconfission. All rights reserved.</p>
  </footer>

  <script>
    function toggleLanguage() {
      const html = document.documentElement;
      const currentLang = html.getAttribute('lang');
      const newLang = currentLang === 'zh-CN' ? 'en' : 'zh-CN';
      html.setAttribute('lang', newLang);
      localStorage.setItem('preferredLang', newLang);
    }

    function toggleTheme() {
      const icon = document.querySelector('.theme-icon');
      icon.textContent = icon.textContent === '☀️' ? '🌙' : '☀️';
    }

    const savedLang = localStorage.getItem('preferredLang');
    if (savedLang) {
      document.documentElement.setAttribute('lang', savedLang);
    }
  </script>
</body>
</html>
