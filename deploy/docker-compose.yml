# 硅基裂变 · 快速起站部署(基于 new-api 官方镜像)
#
# 说明:直接使用 new-api 官方镜像 calciumion/new-api,不修改其源码,
# 因此不触发 AGPL 的开源义务。品牌/配置通过环境变量与后台设置完成。
# 生产上线前务必修改下方所有默认密码(见 .env)。
#
# 启动:  cp .env.example .env  &&  编辑 .env  &&  docker compose up -d
# 访问:  http://<服务器IP>:3000   (首次登录 admin / 见下方初始密码说明)

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: sf-new-api
    restart: always
    ports:
      - "${SF_PORT:-3000}:3000"
    environment:
      # 数据库(默认 PostgreSQL)
      SQL_DSN: "postgresql://${PG_USER:-sfuser}:${PG_PASSWORD:?set in .env}@postgres:5432/${PG_DB:-newapi}"
      # Redis 缓存(多机部署时必须)
      REDIS_CONN_STRING: "redis://default:${REDIS_PASSWORD:?set in .env}@redis:6379"
      TZ: Asia/Shanghai
      NODE_NAME: sf-node-1
      ERROR_LOG_ENABLED: "true"
      # 会话与内部签名密钥,务必改成随机长串
      SESSION_SECRET: "${SESSION_SECRET:?set in .env}"
      # 可选:为整个进程设置出海代理(让服务器能访问 api.openai.com 等)。
      # 更推荐在后台"渠道"里给每个境外渠道单独配 proxy,粒度更细。
      # HTTP_PROXY: "http://your-egress-proxy:port"
      # HTTPS_PROXY: "http://your-egress-proxy:port"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: sf-postgres
    restart: always
    environment:
      POSTGRES_USER: "${PG_USER:-sfuser}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set in .env}"
      POSTGRES_DB: "${PG_DB:-newapi}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sfuser} -d ${PG_DB:-newapi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 默认不对外暴露数据库端口;需本机调试再取消注释
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7
    container_name: sf-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set in .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  redis_data:
