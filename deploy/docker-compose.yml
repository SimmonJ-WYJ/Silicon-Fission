# 硅基裂变 · 后端一键启动(new-api 官方镜像,SQLite 单容器)
#
# 零配置:不需要 .env,直接 `docker compose up -d` 即可。
# 数据保存在 ./data(SQLite),删容器不丢数据。
# 首次启动后,打开前端的 /admin 页面完成初始化(创建管理员 + 配渠道)。
#
# 进阶:多机部署或大流量时再切换 Postgres + Redis(见 docker-compose.full.yml)。

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: sf-new-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
